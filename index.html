<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paul Gorbow</title>
    <meta name="description" content="Paul Gorbow – Senior Researcher and Analyst. Ph.D. in logic, B.Sc. in mathematics with computer science from MIT.">
    <style>
        :root {
            --bg: #fafaf8;
            --text: #1d1d1f;
            --muted: #5f5f66;
            --accent: #28287a;
            --border: #d9d9de;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #16161a;
                --text: #ececef;
                --muted: #a1a1aa;
                --accent: #9d9df0;
                --border: #3a3a42;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
        }
        h1 {
            margin: 24px 0 4px;
            font-size: 2.25rem;
            font-weight: 600;
        }
        .role {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 1.125rem;
        }
        .cv {
            display: inline-block;
            padding: 10px 22px;
            border: 1px solid var(--border);
            border-radius: 999px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        .cv:hover, .cv:focus-visible { border-color: var(--accent); }
    </style>
</head>
<body>
    <main>
        <img src="images/paul-gorbow.jpg" alt="Portrait of Paul Gorbow" width="200" height="200">
        <h1>Paul Gorbow</h1>
        <p class="role">Senior Researcher and Analyst</p>
        <a class="cv" href="files/Paul_Gorbow_CV.pdf">Download CV (PDF)</a>
    </main>
</body>
</html>
